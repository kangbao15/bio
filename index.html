<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@kangbaoreal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0b10;
    --bg-2: #131319;
    --text: #f3f1ec;
    --muted: #8a8896;
    --glow-a: #ff3d81;
    --glow-b: #35e7ff;
    --card: #15151d;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  /* ambient pulse glow behind everything */
  .pulse{
    position:absolute;
    top:50%; left:50%;
    width:600px; height:600px;
    transform:translate(-50%,-50%);
    background: radial-gradient(circle, var(--glow-a) 0%, transparent 60%);
    filter: blur(80px);
    opacity:0.25;
    animation: beat 2.4s ease-in-out infinite;
    z-index:0;
  }
  .pulse.b{
    background: radial-gradient(circle, var(--glow-b) 0%, transparent 60%);
    animation-delay: 1.2s;
  }
  @keyframes beat{
    0%,100%{ transform:translate(-50%,-50%) scale(0.9); opacity:0.18; }
    50%{ transform:translate(-50%,-50%) scale(1.15); opacity:0.32; }
  }

  .card{
    position:relative;
    z-index:1;
    width: 100%;
    max-width: 380px;
    margin: 24px;
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 20px;
    padding: 40px 28px 32px;
    text-align:center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .avatar{
    width: 92px; height: 92px;
    border-radius: 50%;
    margin: 0 auto 18px;
    padding: 3px;
    background: linear-gradient(135deg, var(--glow-a), var(--glow-b));
    display:flex; align-items:center; justify-content:center;
  }
  .avatar img{
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display:block;
    border: 2px solid var(--card);
  }

  h1{
    font-family:'Archivo Black', sans-serif;
    font-size: 22px;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  .handle{
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 4px;
  }

  .bio{
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
    margin: 14px 0 28px;
  }

  .links{
    display:flex;
    flex-direction:column;
    gap: 12px;
  }

  .link-btn{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 14px 18px;
    border-radius: 14px;
    background: var(--bg-2);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text);
    text-decoration:none;
    font-weight: 600;
    font-size: 14.5px;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .link-btn:hover{
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.2);
  }
  .link-btn.tiktok:hover{ box-shadow: 0 8px 24px rgba(255,61,129,0.25); }
  .link-btn.youtube:hover{ box-shadow: 0 8px 24px rgba(255,0,0,0.25); }
  .link-btn.game:hover{ box-shadow: 0 8px 24px rgba(255,210,63,0.3); }

  .icon{
    width: 22px; height: 22px;
    flex-shrink:0;
  }

  .arrow{
    margin-left:auto;
    color: var(--muted);
    font-size: 16px;
  }

  footer{
    margin-top: 26px;
    font-size: 11px;
    color: #55545e;
  }
</style>
</head>

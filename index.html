<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KangBao</title>

  <!-- Bio favicon -->
  <link
    rel="icon"
    type="image/png"
    href="Screenshot%202026-08-19%20180115.png"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --purple: #8b5cf6;
      --purple-light: #a78bfa;
      --white: #ffffff;
      --text-gray: #a1a1aa;
      --dark: #09090b;
      --glass: rgba(20, 20, 24, 0.68);
      --glass-light: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.12);
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--white);

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 24px;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(124, 58, 237, 0.30),
          transparent 42%
        ),
        radial-gradient(
          circle at 0% 100%,
          rgba(91, 33, 182, 0.16),
          transparent 35%
        ),
        #07070b;

      overflow-x: hidden;
    }

    /* Ambient Mica glow */
    body::before {
      content: "";
      position: fixed;
      inset: -20%;

      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(139, 92, 246, 0.10),
          transparent 30%
        );

      filter: blur(80px);
      pointer-events: none;
    }

    .container {
      position: relative;

      width: min(520px, 100%);

      padding: 38px 30px 30px;

      border-radius: 30px;

      background:
        linear-gradient(
          145deg,
          rgba(35, 35, 42, 0.78),
          rgba(12, 12, 16, 0.72)
        );

      border: 1px solid var(--border);

      backdrop-filter:
        blur(45px)
        saturate(140%);

      -webkit-backdrop-filter:
        blur(45px)
        saturate(140%);

      box-shadow:
        0 35px 100px rgba(0, 0, 0, 0.60),
        inset 0 1px 0 rgba(255, 255, 255, 0.10),
        inset 0 0 60px rgba(255, 255, 255, 0.025);
    }

    /* Top glass reflection */
    .container::before {
      content: "";
      position: absolute;

      top: 0;
      left: 8%;
      right: 8%;

      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.35),
          transparent
        );

      opacity: 0.7;
    }

    .profile {
      text-align: center;
      margin-bottom: 30px;
    }

    .avatar {
      width: 104px;
      height: 104px;

      object-fit: cover;

      border-radius: 50%;

      border: 2px solid rgba(255, 255, 255, 0.30);

      box-shadow:
        0 0 0 5px rgba(139, 92, 246, 0.08),
        0 0 35px rgba(124, 58, 237, 0.40);

      margin-bottom: 17px;
    }

    h1 {
      font-size: 31px;
      font-weight: 750;
      letter-spacing: -1px;

      color: #fff;
    }

    .bio {
      margin-top: 7px;

      color: var(--text-gray);

      font-size: 14px;
      letter-spacing: 0.2px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link {
      position: relative;

      min-height: 62px;

      display: flex;
      align-items: center;

      padding: 0 58px;

      border-radius: 18px;

      color: #fff;
      text-decoration: none;

      font-size: 15px;
      font-weight: 650;

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.075),
          rgba(255, 255, 255, 0.035)
        );

      border: 1px solid rgba(255, 255, 255, 0.105);

      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.07),
        0 8px 25px rgba(0, 0, 0, 0.18);

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .link:hover {
      transform: translateY(-2px);

      background:
        linear-gradient(
          135deg,
          rgba(139, 92, 246, 0.18),
          rgba(255, 255, 255, 0.07)
        );

      border-color:
        rgba(167, 139, 250, 0.32);

      box-shadow:
        0 14px 35px rgba(0, 0, 0, 0.30),
        0 0 25px rgba(124, 58, 237, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.10);
    }

    .favicon {
      position: absolute;
      left: 19px;

      width: 26px;
      height: 26px;

      object-fit: contain;

      border-radius: 7px;

      filter:
        drop-shadow(
          0 3px 8px rgba(0, 0, 0, 0.35)
        );
    }

    .arrow {
      position: absolute;
      right: 20px;

      color: #71717a;

      font-size: 18px;

      transition: 0.2s;
    }

    .link:hover .arrow {
      color: var(--purple-light);
      transform: translateX(3px);
    }

    footer {
      margin-top: 28px;

      text-align: center;

      color: #71717a;

      font-size: 12px;
    }

    @media (max-width: 520px) {
      body {
        padding: 14px;
      }

      .container {
        padding: 32px 18px 24px;
        border-radius: 25px;
      }

      .link {
        min-height: 58px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="profile">

      <img

        src="Screenshot%202026-08-19%20180115.png"
        alt="KangBao"

    <section class="links">

      <a

    </section>


    <footer>
      © 2026 KangBao
    </footer>

  </main>

</body>

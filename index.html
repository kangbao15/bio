<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KangBao - Bio</title>

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="Screenshot%202026-08-19%20180115.png"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(
        135deg,
        #16002e,
        #3b0875,
        #16002e
      );
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin: 0 auto 15px;
      object-fit: cover;
      border: 3px solid #b77cff;
      box-shadow:
        0 0 15px #8f42ff,
        0 0 35px rgba(143, 66, 255, 0.5);
    }

    h1 {
      font-size: 30px;
      margin-bottom: 7px;
    }

    .bio {
      color: #d9c5ff;
      margin-bottom: 25px;
      font-size: 15px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      display: block;
      padding: 16px 20px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      text-decoration: none;
      font-weight: bold;
      backdrop-filter: blur(10px);
      transition: 0.2s;
    }

    .link:hover {
      transform: translateY(-3px);
      background: rgba(183, 124, 255, 0.25);
      box-shadow:
        0 8px 25px rgba(143, 66, 255, 0.35);
    }

    footer {
      margin-top: 25px;
      color: #a990c9;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Dùng luôn ảnh Screenshot làm avatar -->
    <img
      src="Screenshot%202026-08-19%20180115.png"
      class="avatar"
      alt="KangBao"
    >

    <h1>KangBao</h1>

    <p class="bio">
      Tech • Coding • Gaming
    </p>

    <div class="links">

      <a
        class="link"
        href="https://www.youtube.com/@kangbaoreal"
        target="_blank"
        rel="noopener noreferrer"
      >
        ▶️ YouTube
      </a>

      <a
        class="link"
        href="https://www.tiktok.com/@kangbaoreal"
        target="_blank"
        rel="noopener noreferrer"
      >
        🎵 TikTok
      </a>

      <a
        class="link"
        href="https://kangbao15.github.io/kbai"
        target="_blank"
        rel="noopener noreferrer"
      >
        🤖 KBAI
      </a>

      <a
        class="link"
        href="https://kangbao15.github.io/auto-click"
        target="_blank"
        rel="noopener noreferrer"
      >
        🖱️ Auto Click
      </a>

    </div>

    <footer>
      © 2026 KangBao
    </footer>

  </div>

</body>
</html>
